# Стадийное дополнение к docker-compose.yml для окружения dev.
# Устанавливается как docker-compose.override.yml — см. deploy.sh / deploy.ps1
# Две записи на порт — петля IPv4 и IPv6: имя localhost на многих системах
# резолвится сначала в ::1, публикация только на 127.0.0.1 оставляла бы его без слушателя.
services:

    router:
      environment:
        CERT_NAME: "wildcard-${PROJECT_DOMAIN}"
        HTTPS_METHOD: "noredirect"
        HSTS: "off"

    backend:
      volumes:
        - ./code/backend:/var/www/html/ # code
        - ./logs/php:/log/php # logs
        - ./config/php-ini/php-prod.ini:/usr/local/etc/php/conf.d/zzz-dev-override-php.ini:ro #php-ini override

    frontend:
        volumes:
          - ./code/frontend:/var/www/html
        ports:
            - "127.0.0.1:${NODE_EXTERNAL_PORT}:5173"
            - "[::1]:${NODE_EXTERNAL_PORT}:5173"

    storage:
        ports:
            - "127.0.0.1:${DB_PORT}:${DB_PORT_INTERNAL}"
            - "[::1]:${DB_PORT}:${DB_PORT_INTERNAL}"
